        canonical: "nawalang-bisa"
        synonyms: ["lapsed policy", "tapos na ang coverage", "hindi aktibo"]
      rider:
        canonical: "karagdagang benepisyo"
        synonyms: ["rider", "additional coverage", "protection add-on"]

  id_id:
