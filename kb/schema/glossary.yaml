# PARLEY Cross-Market Financial & Insurance Glossary
version: "1.0"
markets:
  in_en:
    terms:
      installment:
        canonical: "instalment"
        synonyms: ["installment", "EMI", "monthly instalment", "quarterly premium"]
      grace_period:
        canonical: "grace period"
        synonyms: ["grace days", "tolerance period", "overdue window"]
      lapse:
        canonical: "lapsed policy"
        synonyms: ["terminated cover", "inactive policy", "expired policy"]
      revival:
        canonical: "policy revival"
        synonyms: ["policy reinstatement", "reactivation"]
      cashless:
        canonical: "cashless hospitalisation"
        synonyms: ["cashless admission", "cashless claim", "direct hospital billing"]

