      installment:
        canonical: "angsuran"
        synonyms: ["cicilan", "pembayaran bulanan", "tagihan angsuran"]
      grace_period:
        canonical: "masa tenggang"
        synonyms: ["grace period", "tenggang waktu pembayaran", "toleransi keterlambatan"]
      lapse:
        canonical: "polis tidak aktif"
        synonyms: ["lapsed", "hangus", "berakhir"]
      late_fee:
        canonical: "denda keterlambatan"
        synonyms: ["denda", "biaya pinalti", "late payment charge"]
